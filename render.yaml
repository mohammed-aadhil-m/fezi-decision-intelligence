services:
  # FEZI AI Decision Intelligence Platform
  # Full-Stack Web Service (Vite SPA + Node.js REST API + Decision Engines)
  - type: web
    name: fezi
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fezi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AI_MODEL
        value: gpt-4o-mini

databases:
  # Render PostgreSQL Database (Production Persistence)
  - name: fezi-db
    plan: free
    databaseName: fezi
    user: fezi_user
